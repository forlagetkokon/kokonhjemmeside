        <img src="/assets/images/kokon-logo.svg" alt="" width="44" height="60">

      <a class="logo-navn" href="/index.html" aria-label="Kokon – gå til forsiden">KOKON</a>

        <a class="sidefod-logo" href="/index.html">KOKON</a>

      </div>
      <div class="sidefod-linje" aria-hidden="true"></div>
      <div class="sidefod-links-raekke">
        <nav class="sidefod-navigation" aria-label="Sekundær navigation">
          <a href="/udgivelser.html">Udgivelser</a>
          <a href="/om-kokon.html">Om Kokon</a>

          <span data-theme-label>Lys</span>
        </div>
      </div>

      <p class="overlinje">Billedvisning</p>
      <button class="billeddialog-luk" type="button" data-dialog-close aria-label="Luk billedvisning" autofocus>×</button>
    </div>
    <h2 id="billeddialog-titel" data-dialog-title aria-live="polite">Billede fra udgivelsen</h2>
    <div class="billeddialog-visning">
      <img data-dialog-image alt="">
      <button class="karusel-pil forrige" type="button" data-dialog-prev aria-label="Vis forrige billede">‹</button>
      <button class="karusel-pil naeste" type="button" data-dialog-next aria-label="Vis næste billede">›</button>
    </div>
    <div class="karusel-prikker billeddialog-prikker" data-dialog-dots role="group" aria-label="Vælg billede"></div>
